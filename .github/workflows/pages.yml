name: IBCM 웹사이트 게시

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 설치
        run: python -m pip install -r requirements.txt
      - name: 업무 규칙 검증
        run: python -m unittest discover -v
      - name: 같은 화면 코드로 정적 모드 만들기
        run: python -m portable.build
      - name: GitHub Pages 준비
        uses: actions/configure-pages@v5
      - name: 정적 파일 준비
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: 웹사이트 게시
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 공개 주소에서 최신 화면 확인
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import time
          from urllib.request import Request, urlopen

          url = os.environ["PAGES_URL"]
          expected = Path("docs/index.html").read_bytes()
          for attempt in range(12):
              try:
                  request = Request(url, headers={"Cache-Control": "no-cache"})
                  with urlopen(request, timeout=20) as response:
                      if response.status != 200 or response.read() != expected:
                          raise RuntimeError("공개 주소에 최신 화면이 아직 반영되지 않았습니다.")
                  print(f"공개 주소 확인 완료: {url}")
                  break
              except Exception as error:
                  if attempt == 11:
                      raise
                  print(f"게시 반영 대기 ({attempt + 1}/12): {error}", flush=True)
                  time.sleep(10)
          PY
