name: IBCM 웹사이트 게시

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 설치
        run: python -m pip install -r requirements.txt
      - name: 업무 규칙 검증
        run: python -m unittest discover -v
      - name: 같은 화면 코드로 정적 모드 만들기
        run: python -m portable.build
      - name: GitHub Pages 준비
        uses: actions/configure-pages@v5
      - name: 정적 파일 준비
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: 웹사이트 게시
        id: deployment
        uses: actions/deploy-pages@v4
